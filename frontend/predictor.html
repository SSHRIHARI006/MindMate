<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Depression Predictor</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">MindMate</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/predictor">Predictor</a></li>
        <li><a href="/journal">Journal</a></li>
        <li><a href="/content">Resources</a></li>
        <li><a href="/help">Help</a></li>
      </ul>
    </nav>
    <div class="hero">
      <h1>Depression Risk Checker</h1>
      <p>Answer a few questions to check for signs of depression.</p>
    </div>
  </header>

  <section class="form-section">
    <form id="predictForm">
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="10" max="100" required />

      <label for="degree">Degree:</label>
      <select id="degree" name="degree" required>
        <option value="">Select</option>
        <option value="UG">Undergraduate (UG)</option>
        <option value="PG">Postgraduate (PG)</option>
      </select>

      <label for="course">Course:</label>
      <select id="course" name="course" required>
        <option value="">Select</option>
        <option value="B.Tech">B.Tech</option>
        <option value="LLB">LLB</option>
        <option value="Medical">Medical</option>
        <option value="BBA">BBA</option>
        <option value="BA">BA</option>
        <option value="Other">Other</option>
      </select>

      <label>Sleep Duration:</label>
      <select name="sleep" required>
        <option value="5-6 hours">5-6 hours</option>
        <option value="7-8 hours">7-8 hours</option>
        <option value="Less than 5 hours">Less than 5 hours</option>
        <option value="More than 8 hours">More than 8 hours</option>
        <option value="Others">Others</option>
      </select>

      <label for="diet">Diet:</label>
      <select name="diet" required>
        <option value="Healthy">Healthy</option>
        <option value="Moderate" selected>Moderate</option>
        <option value="Unhealthy">Unhealthy</option>
        <option value="Others">Others</option>
      </select>

      <label for="academicStress">Academic Pressure (1–5):</label>
      <select id="academicStress" name="academicStress" required>
        <option value="">Select</option>
        <option value="1">1 - Very Low</option>
        <option value="2">2 - Low</option>
        <option value="3">3 - Moderate</option>
        <option value="4">4 - High</option>
        <option value="5">5 - Very High</option>
      </select>

      <label>Study Hours per Day:</label>
      <input type="number" step="0.1" name="study" min="0" max="24" required />

      <label for="financialStress">Financial Stress (1–5):</label>
      <select id="financialStress" name="financialStress" required>
        <option value="">Select</option>
        <option value="1">1 - Very Low</option>
        <option value="2">2 - Low</option>
        <option value="3">3 - Moderate</option>
        <option value="4">4 - High</option>
        <option value="5">5 - Very High</option>
      </select>

      <label>Suicidal Thoughts:</label>
      <select name="suicidal" required>
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>

      <label for="selfAssessment">Do you think you have depression?</label>
      <select id="selfAssessment" name="selfAssessment" required>
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
        <option value="Not Sure">Not Sure</option>
      </select>

      <button type="submit" class="btn">Predict</button>
    </form>

    <div id="resultBox" style="margin-top: 20px;"></div>
  </section>

  <footer>
    <p>© 2025 Student Wellness Hub • Take care of your mind 🧠</p>
  </footer>

  <script>
    const form = document.getElementById('predictForm');
    const resultBox = document.getElementById('resultBox');

    function getLikelihoodLevel(confidence) {
      if (confidence < 75) return 'Low';
      else if (confidence < 80) return 'Moderate';
      else if (confidence < 90) return 'High';
      else return 'Very High';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = {
        age: parseInt(formData.get('age')),
        degree: formData.get('degree'),
        course: formData.get('course'),
        sleep: formData.get('sleep'),
        diet: formData.get('diet'),
        academic: parseInt(formData.get('academicStress')),
        study: parseFloat(formData.get('study')),
        stress: parseInt(formData.get('financialStress')),
        suicidal: formData.get('suicidal'),
        selfAssessment: formData.get('selfAssessment')
      };

      resultBox.innerHTML = "Loading...";

      try {
        const response = await fetch("/predictor/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const result = await response.json();
        const confidence = result.confidence;
        const level = getLikelihoodLevel(confidence);

        let color = 'gray';
        let suggestion = '';

        switch (level) {
          case 'Low':
            color = 'green';
            suggestion = 'Keep taking care of your mental health, and explore resources for prevention.';
            break;
          case 'Moderate':
            color = 'orange';
            suggestion = 'Consider using the mental health resources and journaling to monitor your state.';
            break;
          case 'High':
            color = 'red';
            suggestion = 'It is advisable to explore the resources and journal regularly.';
            break;
          case 'Very High':
            color = 'darkred';
            suggestion = 'You should seek support immediately and use all available resources.';
            break;
        }

        resultBox.innerHTML = `
          <h3>Confidence Level: <span style="color: ${color};">${level}</span></h3>
          <p>${suggestion}</p>
          <div style="margin-top: 20px;">
            <strong>Explore More:</strong>
            <ul>
              <li><a href="/journal">Start Journaling</a></li>
              <li><a href="/content">Mental Health Resources</a></li>
              <li><a href="/help">Get Help</a></li>
            </ul>
          </div>
        `;
      } catch (error) {
        resultBox.innerHTML = `<p style="color: red;">Error: Could not fetch prediction.</p>`;
      }
    });
  </script>
</body>
</html>
